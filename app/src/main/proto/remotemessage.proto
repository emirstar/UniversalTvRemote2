syntax = "proto3";

package com.batin.tvremote.proto.remote;

option java_package = "com.batin.tvremote.proto.remote";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

// ---------------------------------------------------------------------------
// Android TV Remote Protocol v2 - REMOTE CONTROL channel (TCP port 6466, TLS
// mutual auth using the certificate that was approved during pairing).
//
// As with pairing.proto, this is a community reverse-engineered schema, not
// an official Google artifact. Field numbers for remote_configure,
// remote_set_active, remote_ping_request/response, remote_key_inject, the
// KeyCode enum, remote_set_volume_level and remote_app_link_launch_request
// have been cross-checked against captured byte traces of a real session and
// are used with confidence by AtvRemoteClient. remote_ime_batch_edit (used
// for sendText) is likewise cross-checked; voice/audio-routing messages are
// reconstructed with lower confidence and are not used by this client.
// ---------------------------------------------------------------------------

message RemoteMessage {
  RemoteConfigure remote_configure = 1;
  RemoteSetActive remote_set_active = 2;
  RemoteError remote_error = 3;

  RemotePingRequest remote_ping_request = 8;
  RemotePingResponse remote_ping_response = 9;

  RemoteKeyInject remote_key_inject = 10;

  RemoteImeKeyInject remote_ime_key_inject = 20;
  RemoteImeBatchEdit remote_ime_batch_edit = 21;
  RemoteImeShowRequest remote_ime_show_request = 22;

  RemoteVoiceBegin remote_voice_begin = 30;
  RemoteVoicePayload remote_voice_payload = 31;
  RemoteVoiceEnd remote_voice_end = 32;

  RemoteStart remote_start = 40;

  RemoteSetVolumeLevel remote_set_volume_level = 50;
  RemoteAdjustVolumeLevel remote_adjust_volume_level = 51;

  RemoteSetPreferredAudioDevice remote_set_preferred_audio_device = 60;
  RemoteResetPreferredAudioDevice remote_reset_preferred_audio_device = 61;

  RemoteAppLinkLaunchRequest remote_app_link_launch_request = 90;
}

// --- Handshake -------------------------------------------------------------

message RemoteDeviceInfo {
  string model = 1;
  string vendor = 2;
  int32 unknown1 = 3;
  string unknown2 = 4;
  string package_name = 5;
  string app_version = 6;
}

message RemoteConfigure {
  int32 code1 = 1;
  RemoteDeviceInfo device_info = 2;
}

message RemoteSetActive {
  int32 active = 1;
}

message RemoteError {
  string description = 1;
}

message RemoteStart {
  bool started = 1;
}

// --- Keep-alive --------------------------------------------------------

message RemotePingRequest {
  int32 val1 = 1;
  int32 val2 = 2;
}

message RemotePingResponse {
  int32 val1 = 1;
}

// --- Key / button events ----------------------------------------------

enum RemoteDirection {
  DIRECTION_UNKNOWN = 0;
  DIRECTION_START_LONG = 1;
  DIRECTION_END_LONG = 2;
  DIRECTION_SHORT = 3;
}

message RemoteKeyInject {
  RemoteKeyCode key_code = 1;
  RemoteDirection direction = 2;
}

// --- App launching -------------------------------------------------------

message RemoteAppLinkLaunchRequest {
  // Either a full deep link (e.g. "https://www.youtube.com/watch?v=...") or,
  // for maximum compatibility across firmware versions, a Play-Store style
  // "market://launch?id=<packageName>" launch link.
  string app_link = 1;
}

// BUGFIX: field numbers below previously skipped `unknown5` and were off by one from
// `volume_max` onward (5/6/7 instead of the TV's actual 6/7/8). Since the TV always sends
// all of these fields together in one message, the old numbering meant `volume_level`'s
// bytes landed in this app's `volume_muted` field (any nonzero volume decoded as "muted",
// since protobuf treats any nonzero varint as `true` for a bool field) and the real
// `volume_max`/`volume_level` values were similarly shifted/scrambled.
message RemoteSetVolumeLevel {
  int32 unknown1 = 1;
  int32 unknown2 = 2;
  string player_model = 3;
  int32 unknown4 = 4;
  int32 unknown5 = 5;
  int32 volume_max = 6;
  int32 volume_level = 7;
  bool volume_muted = 8;
}

message RemoteAdjustVolumeLevel {
  int32 delta = 1;
}

// --- Audio device routing (not used by this client; kept only so parsing
// never breaks if the TV sends one of these messages) ---

message RemoteSetPreferredAudioDevice {
  string device_id = 1;
}

message RemoteResetPreferredAudioDevice {
}

// --- On-screen keyboard / IME (experimental - see class comment above) -----

message RemoteAppInfo {
  string label = 10;
  string app_package = 12;
}

message RemoteTextFieldStatus {
  string value = 2;
  int32 start = 3;
  int32 end = 4;
  string label = 6;
}

message RemoteImeKeyInject {
  RemoteAppInfo app_info = 1;
  RemoteTextFieldStatus text_field_status = 2;
}

// BUGFIX: the previous RemoteEditInfo had no way to carry actual text (it was missing the
// nested RemoteImeObject entirely and used the wrong field number), so this app could not
// use the TV's real text-input channel and fell back to sending individual key codes
// instead - which cannot express Turkish characters (ç/ğ/ı/ö/ş/ü have no HID/AKEYCODE
// equivalent) since it can only replay existing key codes. The corrected messages below
// match the real wire format and carry the literal UTF-8 string, which the TV's IME
// accepts directly - see AtvRemoteClient.sendText().
message RemoteImeObject {
  int32 start = 1;
  int32 end = 2;
  string value = 3;
}

message RemoteEditInfo {
  int32 insert = 1;
  RemoteImeObject text_field_status = 2;
}

message RemoteImeBatchEdit {
  int32 ime_counter = 1;
  int32 field_counter = 2;
  repeated RemoteEditInfo edit_info = 3;
}

message RemoteImeShowRequest {
  RemoteTextFieldStatus text_field_status = 1;
}

// --- Voice search (not implemented by this client) --------------------

message RemoteVoiceBegin {
}

message RemoteVoicePayload {
  bytes payload = 1;
}

message RemoteVoiceEnd {
}

// ---------------------------------------------------------------------------
// KeyCode values below mirror android.view.KeyEvent.KEYCODE_* constants,
// which is what the real Android TV Remote Service expects (this is the same
// integer space used elsewhere in the Android SDK, not something specific to
// this protocol - AndroidKeyCodeMapper.kt maps our app-level RemoteKey enum
// onto these). Only a subset is listed: everything this app's UI can invoke,
// plus common extras a maintainer is likely to want next.
// ---------------------------------------------------------------------------
